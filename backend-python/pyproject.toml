[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-control-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "PyJWT>=2.10,<3", "bcrypt>=4.2,<6",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
